<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="permissions-policy" content="camera=(), microphone=(), geolocation=(), payment=()" />
    <!--
      CSP script-src carries the sha256 of the inline theme bootstrap below.
      It is verified by `node scripts/csp-hash-check.js` (run in `npm run
      build`'s gate set) — if you edit that script, run the checker and paste
      the hash it prints, otherwise the bootstrap is blocked in production.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-BjyiEMuHdOmAbS4mllDxuO/KmwHfGyCkVl5ax7Bs/+o='; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https://*.tauri.app https://*.huggingface.co; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';">
    <title>FinPlan Pro - FP&A Platform</title>
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('finplan-theme') || 'dark';
          const isDark = theme === 'dark';
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.classList.toggle('light', !isDark);
          document.documentElement.style.backgroundColor = isDark ? '#080c14' : '#f1f5f9';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
