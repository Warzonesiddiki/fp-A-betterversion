<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="permissions-policy" content="camera=(), microphone=(), geolocation=(), payment=()" />
    <!--
      CSP script-src carries the sha256 of the inline theme bootstrap below.
      It is verified by `node scripts/csp-hash-check.js` (run in `npm run
      build`'s gate set) — if you edit that script, run the checker and paste
      the hash it prints, otherwise the bootstrap is blocked in production.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-7Fr6DsWabQDzPoL03QSJK5P+7Tyhuh55h1OvhBTuJuU=' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https://*.tauri.app https://*.huggingface.co; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';">
    <title>FinPlan Pro - FP&A Platform</title>
    <script>
      (function() {
        try {
          // Light is the default: FinPlan's UI language is a light, near-white
          // canvas. Only an explicit stored preference of 'dark' (or 'system'
          // on a dark OS) switches away from it.
          //
          // This mirror key is written by ThemeContext. It exists because the
          // real preference lives in the persisted UI store, which is an
          // ENCRYPTED SQLite blob under 'finplan-sqljs-db' — unreadable from a
          // synchronous bootstrap. Reading the store's key here previously
          // always returned null, so the app hard-defaulted to dark and a
          // user's saved choice never survived a reload.
          var stored = localStorage.getItem('finplan-theme');
          var isDark =
            stored === 'dark' ||
            (stored === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.classList.toggle('light', !isDark);
          document.documentElement.style.backgroundColor = isDark ? '#080c14' : '#f8fafc';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
