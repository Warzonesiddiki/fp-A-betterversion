# <!-- DRAFT v0.1 — awaiting review — Atlas 2026-06-13 -->
# =============================================================================
# FinPlan Pro — Production Build Workflow (Milestone 1 of CI matrix split)
# See docs/drafts/atlas/CI_MATRIX.md §3.4 and docs/drafts/atlas/ci/README.md.
# 3-OS matrix; uploads dist/ as artifact. The desktop installers themselves
# are produced by release.yml (tag-triggered) — this is the web bundle only.
# Bundle size check is Linux-only (uses GNU find/gzip).
# =============================================================================

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # G3/G19 limits enforced by scripts/bundle-check.js (single source of truth)
  # MAIN_CHUNK_KB=150, TOTAL_JS_KB=2048, LAZY_VENDOR_KB=300, WARN_THRESHOLD_PCT=90
  # See docs/vision-pivot/INFRASTRUCTURE_READINESS.md §G3 + §G19 for thresholds.

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (npm ci, lockfile-strict)
        run: npm ci --no-audit --no-fund

      - name: Vite production build
        run: npm run build

      - name: Bundle size check (G3 main + G3 total + G19 lazy vendors)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Markdown table for PR summary (informational, all chunks)
          echo "## Bundle Size Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Chunk | Raw (KB) | Gzip (KB) |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|----------|-----------|" >> "$GITHUB_STEP_SUMMARY"
          for f in $(find dist/assets -name "*.js" -type f | sort); do
            NAME=$(basename "$f")
            RAW=$(($(wc -c < "$f") / 1024))
            GZ=$(($(gzip -c "$f" | wc -c) / 1024))
            echo "| $NAME | $RAW | $GZ |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Enforcement: G3 main + G3 total + G19 lazy vendors + 90% warnings
          # Delegates to scripts/bundle-check.js (single source of truth)
          # Emits ::error:: / ::warning:: GH Actions annotations natively
          node scripts/bundle-check.js

      - name: Upload dist artifact (7-day retention)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
